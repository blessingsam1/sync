services:
  backend:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - DATABASE_URL=postgresql+asyncpg://testnet_bot:testnet_bot@postgres:5432/testnet_bot
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - tradesync-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testnet_bot
      POSTGRES_USER: testnet_bot
      POSTGRES_PASSWORD: testnet_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testnet_bot -d testnet_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - tradesync-network

networks:
  tradesync-network:
    driver: bridge

volumes:
  postgres_data:

